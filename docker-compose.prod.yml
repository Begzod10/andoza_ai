# Production stack for a single-host deploy (raw IP:port over HTTP).
#   API:      http://<host>:8000
#   Frontend: http://<host>:5173
#
# Differences from docker-compose.yml (dev):
#   - code is baked into images (no source bind-mounts, no --reload)
#   - frontend is built once and served static via nginx
#   - postgres/redis stay internal (no published host ports)
#
# Deploy:  docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uytamir
      POSTGRES_USER: ${POSTGRES_USER:-uytamir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uytamir} -d uytamir"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      # Persist uploaded media (furniture GLBs, thumbnails, wallpapers) across
      # redeploys. Without this, /app/media lives in the container's ephemeral
      # layer and every `up --build` wipes the catalog's files.
      - media_data:/app/media
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A celery_app worker -l info -Q default,media -c 4
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      # Shared with api — the media queue writes thumbnails/derived files here.
      - media_data:/app/media
    restart: unless-stopped

  # Room-scan GLB overlays on the `converter` queue, built in-process from the
  # parametric scan data with numpy + trimesh. No USD reader and no Blender:
  # this VPS's QEMU vCPU has no SSE4.2, Blender refuses to start on it and
  # usd-core dies with SIGILL (see app/core/room_scan_glb.py). Same image as
  # api/worker. Mounts the shared media volume so it can read the room's stored
  # data and write the .glb back where the api serves it.
  converter:
    build: ./backend
    command: celery -A celery_app worker -l info -Q converter -c 2
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    restart: unless-stopped

  beat:
    build: ./backend
    command: celery -A celery_app beat -l info
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
    depends_on:
      redis:
        condition: service_started
    volumes:
      - media_data:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://andoza.jumaniyozov.uz/api/v1}
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
