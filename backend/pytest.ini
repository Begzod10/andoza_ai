[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    --strict-markers
    --disable-warnings
    -v
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests

[coverage:run]
source = app
omit =
    */migrations/*
    */tests/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
precision = 2
skip_covered = False
